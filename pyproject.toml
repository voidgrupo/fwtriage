[project]
name = "fwtriage"
version = "0.1.0"
description = "Fast, evidence-first security triage for firmware images"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Void Security", email = "contato@augustoflorentino.com" }]
requires-python = ">=3.12"
keywords = ["firmware", "security", "embedded", "iot", "sbom", "sarif", "reverse-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dependencies = [
    "pyelftools>=0.33",
    "pysquashfsimage>=0.9.0",
]

[project.optional-dependencies]
native = [
    "python-lzo>=1.15",
    "zstandard>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/voidgrupo/fwtriage"
Issues = "https://github.com/voidgrupo/fwtriage/issues"
Changelog = "https://github.com/voidgrupo/fwtriage/blob/main/CHANGELOG.md"

[project.scripts]
fwtriage = "fwtriage.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.168.4",
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "PTH", "PL", "RUF", "S", "BLE", "T20", "ERA"]
ignore = ["PLR2004", "PLR0913", "PLR0917", "S101", "S603", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "T20"]
"src/fwtriage/cli.py" = ["T20"]
"src/fwtriage/output/terminal.py" = ["T20"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["fwtriage"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["PySquashfsImage.*", "elftools.*", "lzo", "zstandard"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra", "-m", "not realworld"]
markers = [
    "realworld: downloads hash-pinned public images; opt-in",
    "slow: takes more than a few seconds",
]

[tool.coverage.run]
branch = true
source = ["fwtriage"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
