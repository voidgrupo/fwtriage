name: t22-dispatch-sink
on:
  workflow_dispatch:
    inputs:
      pr_title:
        description: "PR title forwarded by Mergify"
        required: false
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: unsafe-inline
        run: echo "title:" ${{ inputs.pr_title }}

      - name: safe-envvar
        env:
          PR_TITLE: ${{ inputs.pr_title }}
        run: echo "safe:" "$PR_TITLE"

      - name: publish-simulation
        env:
          NPM_TOKEN: fake-npm-token-t22-path-hijack
        run: |
          echo "[publish] which npm: $(which npm)"
          npm --version
          echo "[publish] NPM_TOKEN len=${#NPM_TOKEN}"

      - name: env-downstream
        run: |
          echo "downstream INJECTED_TITLE=$INJECTED_TITLE"
          echo "downstream INJECTED_PATH=$INJECTED_PATH"
