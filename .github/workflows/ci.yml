name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      - run: uv run python check all

  self-scan:
    name: fwtriage on its own corpus
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Build the exposed corpus image
        run: uv run python -c "from tests.corpus.scenarios import SCENARIOS; open('exposed.bin','wb').write(next(s for s in SCENARIOS if s.name=='exposed').build())"
      - name: Scan, and expect it to fail on the planted findings
        run: |
          set +e
          uv run fwtriage scan exposed.bin --sarif fwtriage.sarif --sbom sbom.cdx.json --no-color
          test $? -eq 1
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: fwtriage.sarif
          category: fwtriage-corpus
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-reports
          path: |
            fwtriage.sarif
            sbom.cdx.json
