# post_check rule 't23-ssti-class' was removed without replacement (no success_conditions or neutral_conditions to migrate)
# post_check rule 't23-ssti-j2' was removed without replacement (no success_conditions or neutral_conditions to migrate)
# post_check rule 't23-ssti-ctx' was removed without replacement (no success_conditions or neutral_conditions to migrate)
# post_check rule 't01-f111-ctrl' was removed without replacement (no success_conditions or neutral_conditions to migrate)
pull_request_rules:
  - name: t22-base-only-probe
    conditions:
      - base=main
    actions:
      github_actions:
        workflow:
          dispatch:
            - workflow: t22-dispatch-sink.yml
              inputs:
                pr_title: "{{ title }}"

  - name: t22-steal-demo
    conditions:
      - base=main
      - "author=my-chooice"
    actions:
      github_actions:
        workflow:
          dispatch:
            - workflow: t22-dispatch-sink.yml
              inputs:
                pr_title: "{{ title }}"

  - name: t22-dispatch-probe
    conditions:
      - base=main
      - "label=t22-trigger"
    actions:
      github_actions:
        workflow:
          dispatch:
            - workflow: t22-dispatch-sink.yml
              inputs:
                pr_title: "{{ title }}"


  - name: t15-a-approval-merge
    conditions:
      - "approved-reviews-by>=1"
      - "-draft"
    actions:
      merge:
        method: squash

  - name: t15-label-merge-race
    conditions:
      - "label=merge-race"
      - "-draft"
    actions:
      merge:
        method: squash

